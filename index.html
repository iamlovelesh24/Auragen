<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AuraGen - Click & Hesitation Detection</title>
</head>

<body>

    <h1>AuraGen</h1>

    <h2>Click & Hesitation Detection</h2>

    <p>
        This page is a prototype for detecting user clicks
        and hesitation during interaction.
    </p>

    <button id="testButton">Click Me</button>

    <p>
        Click Count:
        <span id="clickCount">0</span>
    </p>

    <p>
        Hesitation Time:
        <span id="hesitationTime">--</span>
    </p>

     <p>
         Mouse Velocity:
         <span id="mouseVelocity">0</span>
     </p>

     <p>
        Click Pattern:
        <span id="clickPattern">Waiting</span>
    </p>

    <p>
        Status:
        <span id="status">Waiting for interaction</span>
    </p>

    <script src="script.js"></script>

</body>
</html>
